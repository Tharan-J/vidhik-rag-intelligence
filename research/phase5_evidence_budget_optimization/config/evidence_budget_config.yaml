# Phase 5.2 Evidence Budget Optimization Experiment Configuration
experiment_version: "5.2.0"
pipeline_id: "P5_2_EVIDENCE_BUDGET"

benchmark:
  document_count: 9
  benchmark_doc_ids:
    - "DC_000001"
    - "DC_000002"
    - "DC_000003"
    - "DC_000004"
    - "DC_000005"
    - "DC_000006"
    - "DC_000007"
    - "DC_000008"
    - "DC_000011"
  gold_facts_path: "phase5_source_grounded_gold/gold_facts.parquet"
