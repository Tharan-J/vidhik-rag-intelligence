  tokenizer_path: "rag_experiments/indexes/models/bge-m3/tokenizer.json"
  embedding_dim: 1024
  cache_path: "phase5_evidence_budget_optimization/corpus/candidate_window_embeddings_bge_m3.npy"

query:
  base_task_query: "Case identity, court, presiding judge, parties, complainant, accused, charges, statutory provisions, procedural history, witness evidence, judicial findings, decision, disposition, acquittal, conviction, committal order, relief, bail custody, monetary amount."
