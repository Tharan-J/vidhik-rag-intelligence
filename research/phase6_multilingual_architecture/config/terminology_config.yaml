# Phase 6 Legal Terminology & Entity Protection Configuration
# Vidhik Research Pipeline - Controlled Legal Translation Layer

protection_strategy:
  placeholder_pattern: "__ENTITY_{idx}__"
  token_safe_format: true
  min_length: 2

entity_patterns:
  case_numbers:
    - "(?:(?:Spl\\.?\\s*)?(?:C\\.?C\\.?|Crl\\.?\\s*A\\.?|M\\.?A\\.?C\\.?P\\.?|Special Case|Civil Suit|Cr\\. No\\.|Crime No\\.|FIR No\\.)\\s*(?:No\\.?\\s*)?[0-9]+/[0-9]{2,4})"
    - "(?:Case\\s+No\\.?\\s*[0-9]+/[0-9]{2,4})"
  statutory_sections:
    - "(?:Sections?\\s+[0-9]+(?:\\s*\\([0-9a-zA-Z]+\\))*(?:\\s*(?:and|&|,)\\s*[0-9]+(?:\\s*\\([0-9a-zA-Z]+\\))*)*\\s+(?:of\\s+(?:the\\s+)?)?(?:IPC|Cr\\.?P\\.?C\\.?|I\\.?P\\.?C\\.?|Indian Penal Code|Code of Criminal Procedure|Negotiable Instruments Act|N\\.?I\\.?\\s*Act|Motor Vehicles Act|M\\.?V\\.?\\s*Act|POCSO(?:\\s+Act)?|BNS|BNSS))"
    - "(?:u/s\\.?\\s+[0-9]+(?:\\s*\\([0-9a-zA-Z]+\\))*(?:\\s*(?:and|&|,)\\s*[0-9]+(?:\\s*\\([0-9a-zA-Z]+\\))*)*\\s*(?:IPC|Cr\\.?P\\.?C\\.?|I\\.?P\\.?C\\.?|Indian Penal Code)?)"
    - "(?:Section\\s+[0-9]+[A-Za-z]?(?:\\([0-9a-zA-Z]+\\))?)"
  currency_amounts:
    - "(?:(?:Rs\\.?|INR|₹)\\s*[0-9,]+(?:\\.[0-9]{2})?)"
    - "(?:[0-9,]+(?:\\.[0-9]{2})?\\s*(?:rupees|lakh|crore|lakhs|crores))"
  dates:
    - "(?:[0-9]{1,2}[./-][0-9]{1,2}[./-][0-9]{2,4})"
    - "(?:[0-9]{1,2}(?:st|nd|rd|th)?\\s+(?:January|February|March|April|May|June|July|August|September|October|November|December),?\\s+[0-9]{4})"
    - "(?:(?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+[0-9]{1,2}(?:st|nd|rd|th)?,?\\s+[0-9]{4})"

critical_legal_terms:
  disposition:
    - term: "acquitted"
      target_glossary:
        ta: "விடுவிக்கப்பட்டார்"
        hi: "बरी किया गया"
        kn: "ಖುಲಾಸೆಗೊಳಿಸಲಾಗಿದೆ"
        mr: "निर्दोष मुक्त केले"
    - term: "convicted"
      target_glossary:
        ta: "குற்றவாளி என தீர்ப்பளிக்கப்பட்டது"
        hi: "दोषी ठहराया गया"
        kn: "ದೋಷಿ ಎಂದು ತೀರ್ಮಾನಿಸಲಾಯಿತು"
        mr: "दोषी ठरवले"
    - term: "dismissed"
      target_glossary:
        ta: "தள்ளுபடி செய்யப்பட்டது"
        hi: "खारिज किया गया"
        kn: "ವಜಾಗೊಳಿಸಲಾಗಿದೆ"
        mr: "फेटाळण्यात आला"
    - term: "allowed"
      target_glossary:
        ta: "அனுமதிக்கப்பட்டது"
        hi: "स्वीकार किया गया"
        kn: "ಪುರಸ್ಕರಿಸಲಾಗಿದೆ"
        mr: "मंजूर करण्यात आला"
  bail:
    - term: "bail granted"
      target_glossary:
        ta: "ஜாமீன் வழங்கப்பட்டது"
        hi: "जमानत मंजूर की गई"
        kn: "ಜಾಮೀನು ಮಂಜೂರು ಮಾಡಲಾಗಿದೆ"
        mr: "जामीन मंजूर केला"
    - term: "anticipatory bail"
      target_glossary:
        ta: "முன்ஜாமீன்"
        hi: "अग्रिम जमानत"
        kn: "ನಿರೀಕ್ಷಣಾ ಜಾಮೀನು"
        mr: "अगाऊ जामीन"
    - term: "bail rejected"
      target_glossary:
        ta: "ஜாமீன் நிராகரிக்கப்பட்டது"
        hi: "जमानत खारिज की गई"
        kn: "ಜಾಮೀನು ತಿರಸ್ಕರಿಸಲಾಗಿದೆ"
        mr: "जामीन नाकारला"
